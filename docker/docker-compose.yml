services:
  backend:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8028:8028"
    volumes:
      - ./docker/logs:/app/logs
      - model_cache:/app/.models
    environment:
      - DEBUG=true
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8028/').close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8028
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  model_cache:

networks:
  app-network:
    driver: bridge
